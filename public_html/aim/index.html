<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saberkratia's Aim Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header>
    <a class="icon-widget" href="../" aria-label="Home">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg>
    </a>
    <a class="icon-widget" href="https://discord.gg/3MQgU75urQ" target="_blank" rel="noopener noreferrer" aria-label="Discord"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.182 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></a>
    <a class="icon-widget twitch-link" href="https://www.twitch.tv/saberkratia" target="_blank" rel="noopener noreferrer" aria-label="Twitch">
      <img src="twitch.png" alt="Watch me on Twitch">
      <span class="live-badge" aria-hidden="true">LIVE</span>
    </a>
    <h1>CPS Aim Trainer</h1>
  </header>

  <section class="modes" id="modes">
    <button data-mode="right" class="active">1 · Right Click</button>
    <button data-mode="q">2 · Attack Key + Left Click</button>
    <button data-mode="adaptive">3 · Adaptive</button>
    <button id="settingsBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
  </section>

  <div class="dropwrap"><section class="panel settings" id="settings" hidden>
    <button id="qKeyBtn">Attack key: A</button>
    <button id="champKeyBtn">Champ-only key: X</button>
    <label class="slider">Distance (<span id="radiusVal">Size 3</span>)
      <input type="range" id="radiusSlider" min="1" max="6" step="1" value="3" list="radiusOptions">
      <datalist id="radiusOptions">
        <option value="1"></option>
        <option value="2"></option>
        <option value="3"></option>
        <option value="4"></option>
        <option value="5"></option>
        <option value="6"></option>
      </datalist>
    </label>
    <label class="slider">Target size (<span id="sizeVal">Size 3</span>)
      <input type="range" id="sizeSlider" min="1" max="6" step="1" value="3" list="sizeOptions">
      <datalist id="sizeOptions">
        <option value="1"></option>
        <option value="2"></option>
        <option value="3"></option>
        <option value="4"></option>
        <option value="5"></option>
        <option value="6"></option>
      </datalist>
    </label>
    <label class="slider">Click volume <input type="range" id="volSlider" min="0" max="100" step="1" value="40"></label>
    <label class="slider"><input type="checkbox" id="forgiveChk" checked> Forgiving mode (missed clicks advance to next target)</label>
  </section></div>

  <section class="stats">
    <div><span>Time</span><b id="sTime">30.0</b></div>
    <div><span>CPS</span><b id="sCps">0.0</b></div>
    <div><span>Accuracy</span><b id="sAcc">0%</b></div>
    <div><span>Hits</span><b id="sHits">0</b></div>
    <div><span>Misses</span><b id="sMiss">0</b></div>
    <div><span>Avg / hit</span><b id="sAvg">–</b></div>
  </section>

  <section class="arena">
    <canvas id="game" width="800" height="560"></canvas>
  </section>

  <p class="hint" id="hint"></p>

  <section class="panel">
    <div class="row graph-filter">
      <h2 id="graphTitle">History</h2>
      <label class="slider"><input type="checkbox" id="splitChk"> Separate graph by settings</label>
      <select id="splitSel" aria-label="Settings to show" hidden></select>
    </div>
    <canvas id="graph" width="800" height="260"></canvas>
    <div class="row">
      <button id="exportBtn">Export JSON</button>
      <button id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </section>
</div>
<script src="script.js"></script>
<script src="../twitch-status.js" defer></script>
</body>
</html>
